<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutoreal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Tutoreal</h1>
      <p>내시경실 영어 디지털 교과서</p>
    </header>

    <section id="view-list">
      <h2>챕터</h2>
      <div id="chapter-list"></div>
    </section>

    <section id="view-detail" hidden>
      <button class="link" id="back">‹ 챕터 목록</button>
      <div class="card">
        <p class="eyebrow" id="detail-no"></p>
        <h3 id="detail-title"></h3>
        <p class="goal" id="detail-goal"></p>
        <h2>핵심 단어</h2>
        <div class="chips" id="detail-keywords"></div>
        <button class="primary" disabled>대화 시작</button>
        <p class="hint">음성 대화는 5단계에서 열려요.</p>
      </div>
    </section>

    <footer id="version"></footer>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
