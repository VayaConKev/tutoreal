<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tutoreal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Tutoreal</h1>
      <p>내시경실 영어 디지털 교과서</p>
      <p class="who" id="who" hidden><span id="who-name"></span> · <button class="link" id="logout">코드 바꾸기</button></p>
    </header>

    <section id="view-login" hidden>
      <form class="card" id="login-form">
        <h3>접속 코드</h3>
        <p class="goal">선생님께 받은 접속 코드를 입력해 주세요.</p>
        <input id="login-code" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
               aria-label="접속 코드" placeholder="접속 코드">
        <button class="primary" type="submit" id="login-submit">들어가기</button>
        <p class="hint" id="login-msg" role="alert"></p>
      </form>
    </section>

    <section id="view-list" hidden>
      <h2>챕터</h2>
      <div id="chapter-list"></div>
    </section>

    <section id="view-detail" hidden>
      <button class="link" id="back">‹ 챕터 목록</button>
      <div class="card">
        <p class="eyebrow" id="detail-no"></p>
        <h3 id="detail-title"></h3>
        <p class="goal" id="detail-goal"></p>
        <h2>핵심 단어</h2>
        <div class="chips" id="detail-keywords"></div>
        <button class="primary" id="talk-start">대화 시작</button>
        <p class="hint">마이크를 사용해요. 음성은 저장하지 않아요.</p>
      </div>
    </section>

    <section id="view-talk" hidden>
      <div class="card talk-head" id="talk-head">
        <div class="talk-head-row">
          <p class="eyebrow" id="talk-chapter"></p>
          <span class="talk-time" id="talk-time">0:00</span>
        </div>
        <h3 id="talk-name">수검자 준비 중…</h3>
        <p class="talk-meta"><span id="talk-dob">–</span> · <span id="talk-exam">–</span></p>
      </div>
      <p class="talk-status" id="talk-status" role="status"></p>
      <div class="transcript" id="transcript"></div>
      <p class="talk-info" id="talk-info" hidden></p>
      <div class="talk-actions">
        <button class="primary" id="talk-end">대화 끝내기</button>
        <button class="secondary" id="talk-back" hidden>챕터로 돌아가기</button>
      </div>
    </section>

    <footer id="version"></footer>
  </div>
  <script>
    // 새 버전을 바로 받게 하는 서비스 워커 (sw.js). 다른 파일이 예전 것이어도 여기서 먼저 등록되도록 이 파일에 둔다.
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
